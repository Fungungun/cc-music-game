<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Challenge — Music Maestro</title>
  <meta name="description" content="Complete a short daily set of Grade 1–3 piano theory questions with explanations and local progress tracking.">
  <link rel="canonical" href="https://music.vensoai.com/daily-challenge">
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-header { background: linear-gradient(90deg, #E65100, #FFCC80); }
    .page-header h1 { color: white; }
    .back-btn { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.5); color: white; }

    .start-screen { text-align:center; padding:28px 16px 32px; max-width:560px; margin:0 auto; }
    .start-title { font-size:1.7rem; font-weight:900; color:#BF360C; margin-bottom:6px; }
    .start-sub { font-size:0.95rem; color:#666; margin-bottom:20px; }

    .streak-hero { background:white; border-radius:20px; padding:20px; margin:14px 0; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
    .streak-flame { font-size:2.6rem; }
    .streak-days { font-size:1.5rem; font-weight:900; color:#E65100; }
    .streak-cal { display:flex; gap:6px; justify-content:center; margin-top:12px; }
    .cal-dot { width:34px; text-align:center; }
    .cal-dot .d-label { font-size:0.65rem; color:#aaa; font-weight:700; }
    .cal-dot .d-mark { width:26px; height:26px; border-radius:50%; margin:3px auto 0; display:flex; align-items:center; justify-content:center; font-size:0.85rem; background:#f0f2f7; color:#ccc; }
    .cal-dot .d-mark.done { background:linear-gradient(135deg,#FFB74D,#FF8A65); color:white; }

    .q-header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#FFF3E0; border-bottom:2px solid #FFE0B2; }
    .q-progress-text { font-size:0.9rem; font-weight:700; color:#E65100; white-space:nowrap; }
    .q-bar-wrap { flex:1; height:8px; background:#FFE0B2; border-radius:4px; overflow:hidden; }
    .q-bar-fill { height:100%; background:linear-gradient(90deg,#F57C00,#FFB74D); border-radius:4px; transition:width 0.3s; }
    .q-score-chip { background:#F57C00; color:white; border-radius:12px; padding:3px 12px; font-size:0.85rem; font-weight:800; white-space:nowrap; }

    .q-card { background:white; border-radius:20px; padding:20px 16px; margin:10px 12px; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
    .q-type-chip { display:inline-block; background:#FFE0B2; color:#E65100; border-radius:12px; padding:3px 12px; font-size:0.82rem; font-weight:800; margin-bottom:10px; }
    .q-text { font-size:1.05rem; font-weight:700; margin-bottom:12px; line-height:1.4; }
    .q-staff-box { background:#FAFAFA; border:1px solid #eee; border-radius:12px; padding:8px 4px; text-align:center; margin:10px 0; min-height:70px; }

    .choices-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:12px 0; }
    .choices-grid.single-col { grid-template-columns:1fr; }
    .choice-btn { padding:13px 8px; border-radius:14px; border:2px solid #ddd; background:white; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.15s; font-family:inherit; text-align:center; line-height:1.3; }
    .choice-btn:hover:not(:disabled) { background:#FFF3E0; border-color:#F57C00; transform:translateY(-1px); }
    .choice-btn.correct-ans { background:#c8f7dc; border-color:#4caf50; }
    .choice-btn.wrong-ans { background:#fdd; border-color:#f44336; }
    .choice-btn:disabled { cursor:default; }
    .choice-btn.locked { opacity:0.45; cursor:not-allowed; }

    .q-feedback { text-align:center; font-size:1.05rem; font-weight:700; min-height:32px; padding:6px; }
    .q-feedback.correct { color:#4CAF50; }
    .q-feedback.wrong { color:#FF6B6B; }
    .q-explanation { background:#FFF3E0; border-radius:10px; padding:9px 13px; font-size:0.87rem; color:#555; margin:7px 0; display:none; line-height:1.5; }
    .next-q-btn { width:100%; background:linear-gradient(90deg,#F57C00,#FFB74D); color:white; border:none; border-radius:14px; padding:13px; font-size:0.95rem; font-weight:800; cursor:pointer; font-family:inherit; margin-top:8px; display:none; }

    .play-aural-btn { display:block; width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,#F57C00,#FFB74D); color:white; border:none; font-size:1.9rem; cursor:pointer; margin:8px auto; box-shadow:0 4px 14px rgba(245,124,0,0.4); transition:transform 0.1s; }
    .play-aural-hint { font-size:0.82rem; color:#888; text-align:center; margin-bottom:8px; }

    .results-screen { text-align:center; padding:20px 14px 32px; max-width:560px; margin:0 auto; }
    .result-emoji { font-size:4rem; margin:10px 0; }
    .result-title { font-size:1.5rem; font-weight:900; color:#BF360C; }
    .result-sub { font-size:0.95rem; color:#666; margin:6px 0 16px; }
    .home-btn { background:white; color:#E65100; border:2px solid #E65100; border-radius:20px; padding:13px 26px; font-size:0.95rem; font-weight:800; cursor:pointer; margin:8px; font-family:inherit; }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p>Loading piano sounds... </p>
</div>

<header class="page-header">
  <a href="index.html" class="back-btn">←</a>
  <h1 class="page-title">Daily Challenge</h1>
  <div id="header-score" class="score-display" style="display:none;">
    <span id="header-score-text">0/0</span>
  </div>
</header>

<!-- ═══ START / ALREADY-DONE SCREEN ═══ -->
<div id="screen-start">
  <div class="start-screen">
    <div class="start-title">Daily Challenge </div>
    <div class="start-sub">5 mixed questions from your grade — once a day, every day</div>

    <div class="streak-hero">
      <span class="streak-flame"></span>
      <div class="streak-days"><span id="streak-count">0</span>-day streak</div>
      <div class="streak-cal" id="streak-cal"></div>
    </div>

    <div id="today-status"></div>

    <button class="btn btn-primary" id="start-btn" onclick="startChallenge()"
      style="font-size:1.1rem;padding:16px 38px;margin-top:6px;" disabled>
      Play today's 5 questions
    </button>
  </div>
</div>

<!-- ═══ QUESTION SCREEN ═══ -->
<div id="screen-question" style="display:none;">
  <div class="q-header">
    <span class="q-progress-text">Q&nbsp;<span id="q-num">1</span>/5</span>
    <div class="q-bar-wrap"><div class="q-bar-fill" id="q-bar" style="width:0%"></div></div>
    <div class="q-score-chip">Correct&nbsp;<span id="q-correct-count">0</span></div>
  </div>

  <div class="q-card">
    <div class="q-type-chip" id="q-chip"></div>
    <div class="q-text" id="q-text"></div>

    <div id="q-staff-box" class="q-staff-box" style="display:none;">
      <div id="q-staff"></div>
    </div>

    <div id="q-aural-box" style="display:none;">
      <button class="play-aural-btn" id="q-play-btn" onclick="playAural()">▶</button>
      <div class="play-aural-hint">Tap ▶ to listen, then choose your answer</div>
    </div>

    <div class="choices-grid" id="q-choices"></div>

    <div class="q-feedback" id="q-feedback"></div>
    <div class="q-explanation" id="q-explanation"></div>
    <button class="next-q-btn" id="q-next-btn" onclick="advanceQuestion()">Next →</button>
  </div>
</div>

<!-- ═══ RESULTS SCREEN ═══ -->
<div id="screen-results" style="display:none;">
  <div class="results-screen">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-sub" id="result-sub"></div>

    <div class="streak-hero">
      <span class="streak-flame"></span>
      <div class="streak-days"><span id="result-streak">0</span>-day streak</div>
      <div class="streak-cal" id="result-cal"></div>
    </div>

    <p style="font-size:0.9rem;color:#888;">Come back tomorrow for 5 new questions!</p>
    <button class="home-btn" onclick="window.location.href='index.html'"> Home</button>
  </div>
</div>

<script src="i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.32/Tone.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/abcjs/dist/abcjs-basic-min.js"></script>
<script src="growth.js"></script>
<script src="auth.js"></script>
<script src="game.js"></script>
<script src="exam-questions.js"></script>
<script>
/* ============================================================
   Daily Challenge — 5 questions/day from the shared generators
   ============================================================ */

var QUESTIONS_PER_DAY = 5;

function getDailyData() {
  try { return JSON.parse(localStorage.getItem('cc-daily')) || { lastPlayed:'', history:{} }; }
  catch(e) { return { lastPlayed:'', history:{} }; }
}
function saveDailyData(d) {
  try { localStorage.setItem('cc-daily', JSON.stringify(d)); } catch(e) {}
}

function buildCalendar(elId) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = '';
  var streak = getDayStreak();
  var labels = ['S','M','T','W','T','F','S'];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(Date.now() - i * 86400000);
    var key = _localDateStr(d);
    var done = !!(streak.history && streak.history[key]);
    var dot = document.createElement('div');
    dot.className = 'cal-dot';
    dot.innerHTML =
      '<div class="d-label">' + labels[d.getDay()] + '</div>' +
      '<div class="d-mark' + (done ? ' done' : '') + '">' + (done ? 'Done' : 'Open') + '</div>';
    el.appendChild(dot);
  }
}

function refreshStartScreen() {
  var streak = getDayStreak();
  document.getElementById('streak-count').textContent = streak.days || 0;
  buildCalendar('streak-cal');

  var daily = getDailyData();
  var today = _localDateStr();
  var statusEl = document.getElementById('today-status');
  var startBtn = document.getElementById('start-btn');
  if (daily.lastPlayed === today) {
    var scoreToday = daily.history && daily.history[today];
    statusEl.innerHTML = '<p style="color:#315c45;font-weight:800;margin:8px 0;">Done for today — you scored ' +
      scoreToday + '/' + QUESTIONS_PER_DAY + '. Come back tomorrow!</p>';
    startBtn.style.display = 'none';
  } else {
    statusEl.innerHTML = '';
    startBtn.style.display = 'inline-block';
  }
}

/* ── Session ── */
var session = { questions:[], current:0, correct:0, answered:false, advancing:false };
var score = new SessionScore('daily-challenge');

function startChallenge() {
  session.questions = buildPool(getGrade(), QUESTIONS_PER_DAY);
  session.current = 0;
  session.correct = 0;

  document.getElementById('screen-start').style.display    = 'none';
  document.getElementById('screen-question').style.display = 'block';
  document.getElementById('header-score').style.display    = 'flex';
  showQuestion(0);
}

function showQuestion(idx) {
  var q = session.questions[idx];
  session.answered = false;
  session.advancing = false;

  document.getElementById('q-num').textContent = idx + 1;
  document.getElementById('q-bar').style.width = (idx / QUESTIONS_PER_DAY * 100) + '%';
  document.getElementById('q-correct-count').textContent = session.correct;
  document.getElementById('header-score-text').textContent = session.correct + '/' + idx;
  document.getElementById('q-chip').textContent = q.chip;
  document.getElementById('q-text').innerHTML = q.text;

  var staffBox = document.getElementById('q-staff-box');
  if (q.abcStr) {
    staffBox.style.display = 'block';
    setTimeout(function(){ renderAbc('q-staff', q.abcStr, {scale:2.2, staffwidth:260}); }, 10);
  } else {
    staffBox.style.display = 'none';
    document.getElementById('q-staff').innerHTML = '';
  }

  var auralBox = document.getElementById('q-aural-box');
  if (q.aural) {
    auralBox.style.display = 'block';
    var pb = document.getElementById('q-play-btn');
    pb.textContent = '▶'; pb.disabled = false;
  } else {
    auralBox.style.display = 'none';
  }

  var grid = document.getElementById('q-choices');
  grid.innerHTML = '';
  grid.className = 'choices-grid' + (q.choices.length <= 2 ? ' single-col' : '');
  q.choices.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn' + (q.aural ? ' locked' : '');
    btn.innerHTML = ch;
    if (q.aural) btn.disabled = true;
    btn.onclick = function(){ checkAnswer(ch, btn, q); };
    grid.appendChild(btn);
  });

  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className = 'q-feedback';
  document.getElementById('q-explanation').style.display = 'none';
  document.getElementById('q-next-btn').style.display = 'none';
}

function checkAnswer(chosen, btn, q) {
  if (session.answered) return;
  session.answered = true;

  var allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(function(b){ b.disabled = true; b.classList.remove('locked'); });

  var isOk = (chosen === q.answer);
  if (isOk) {
    btn.classList.add('correct-ans');
    session.correct++;
    document.getElementById('q-feedback').textContent = randomCorrect();
    document.getElementById('q-feedback').className = 'q-feedback correct';
    triggerStarburst(btn);
    score.onCorrect();
    trackAnswer('daily-challenge', q.concept, true);
  } else {
    btn.classList.add('wrong-ans');
    allBtns.forEach(function(b){ if (b.innerHTML === q.answer) b.classList.add('correct-ans'); });
    addShake(btn);
    document.getElementById('q-feedback').textContent = randomWrong();
    document.getElementById('q-feedback').className = 'q-feedback wrong';
    score.onWrong();
    trackAnswer('daily-challenge', q.concept, false);
  }

  var expEl = document.getElementById('q-explanation');
  expEl.innerHTML = q.explanation;
  expEl.style.display = 'block';

  var nextBtn = document.getElementById('q-next-btn');
  nextBtn.textContent = session.current < QUESTIONS_PER_DAY - 1 ? 'Next Question →' : 'Finish ';
  nextBtn.style.display = 'block';
  document.getElementById('q-correct-count').textContent = session.correct;
  document.getElementById('header-score-text').textContent = session.correct + '/' + (session.current + 1);

  if (isOk) {
    setTimeout(function(){ if (!session.advancing) advanceQuestion(); }, 1800);
  }
}

function advanceQuestion() {
  if (session.advancing) return;
  session.advancing = true;
  document.getElementById('q-next-btn').style.display = 'none';

  if (session.current < QUESTIONS_PER_DAY - 1) {
    session.current++;
    showQuestion(session.current);
  } else {
    showResults();
  }
}

function playAural() {
  var q = session.questions[session.current];
  if (!q || !q.playChords) return;
  ensureAudio().then(function() {
    var btn = document.getElementById('q-play-btn');
    btn.disabled = true; btn.textContent = '♪';
    var t = Tone.now() + 0.05;
    q.playChords.forEach(function(chord, i) {
      sampler.triggerAttackRelease(chord, '2n', t + i * 1.3);
    });
    var dur = (q.playChords.length * 1.3 + 1.0) * 1000;
    setTimeout(function() {
      btn.textContent = '▶'; btn.disabled = false;
      document.querySelectorAll('.choice-btn').forEach(function(b){
        b.disabled = false; b.classList.remove('locked');
      });
    }, dur);
  });
}

function showResults() {
  /* Record today's play */
  var daily = getDailyData();
  var today = _localDateStr();
  daily.lastPlayed = today;
  daily.history = daily.history || {};
  daily.history[today] = session.correct;
  saveDailyData(daily);
  var streak = recordDailyActivity();
  if (typeof window.mmTrack === 'function') window.mmTrack('practice_complete');

  document.getElementById('screen-question').style.display = 'none';
  document.getElementById('screen-results').style.display = 'block';
  document.getElementById('header-score').style.display = 'none';

  var pct = session.correct / QUESTIONS_PER_DAY;
  var emoji = pct === 1 ? '' : pct >= 0.8 ? '' : pct >= 0.6 ? '' : '';
  var title = pct === 1 ? 'Perfect 5/5!' : session.correct + '/' + QUESTIONS_PER_DAY + ' today';
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent =
    pct === 1 ? 'Flawless! See you tomorrow ' : 'Every day makes you stronger. See you tomorrow!';
  document.getElementById('result-streak').textContent = streak.days || 1;
  buildCalendar('result-cal');
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', function() {
  refreshStartScreen();
  initSampler(function() {
    document.getElementById('start-btn').disabled = false;
  });
});
</script>
</body>
</html>
