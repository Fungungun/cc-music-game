<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theory Lessons — AMEB Piano 2026</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Purple identity — course pages */
    .page-header { background: linear-gradient(90deg, #5B21B6, #7C3AED); }
    .page-header::after { display: none; }
    .page-header h1 { color: white; }
    .page-header .subtitle { color: rgba(255,255,255,0.82); }
    .back-btn { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.35); color: white; }
    .back-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.08); }
    /* Wider canvas for sidebar + content */
    .main-content { max-width: 1120px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.32/Tone.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/abcjs/dist/abcjs-basic-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="game.js"></script>
</head>
<body>
<div class="page-wrap">

  <header class="page-header">
    <a href="index.html" class="back-btn" aria-label="Home">←</a>
    <div style="flex:1;">
      <h1>Theory Lessons</h1>
      <div class="subtitle">AMEB Piano 2026 — Grades 1, 2 &amp; 3</div>
    </div>
    <span aria-hidden="true" style="width:44px;"></span>
  </header>

  <main class="main-content" id="main-content">
    <!-- .ameb-page-tag auto-injected by game.js -->

    <!-- Mobile lesson picker (hidden on desktop, shown ≤780px) -->
    <div class="course-mobile-nav" id="course-mobile-nav">
      <div class="course-sidebar-title">Theory Lessons</div>
      <div class="course-grade-tabs-mobile">
        <button class="course-grade-tab active" data-grade="1" onclick="switchGrade(1)">Grade 1</button>
        <button class="course-grade-tab" data-grade="2" onclick="switchGrade(2)">Grade 2</button>
        <button class="course-grade-tab" data-grade="3" onclick="switchGrade(3)">Grade 3</button>
      </div>
      <select id="lesson-select-mobile" onchange="navigateTo(this.value)"></select>
    </div>

    <div class="course-layout">

      <!-- Sidebar -->
      <nav class="course-sidebar" id="course-sidebar" aria-label="Lessons">
        <div class="course-sidebar-hd">
          <div class="course-sidebar-title">Theory Lessons</div>
          <div class="course-grade-tabs">
            <button class="course-grade-tab active" data-grade="1" onclick="switchGrade(1)">Grade 1</button>
            <button class="course-grade-tab" data-grade="2" onclick="switchGrade(2)">Grade 2</button>
            <button class="course-grade-tab" data-grade="3" onclick="switchGrade(3)">Grade 3</button>
          </div>
        </div>
        <ul class="course-lesson-list" id="lesson-list" role="list"></ul>
      </nav>

      <!-- Lesson main area -->
      <div class="course-main" id="course-main">
        <div class="course-lesson-meta" id="lesson-meta"></div>
        <div class="course-lesson-content" id="lesson-content">
          <p class="course-loading">Loading lesson…</p>
        </div>
        <div class="course-lesson-footer" id="lesson-footer" style="display:none">
          <a id="prev-btn" class="btn btn-secondary" href="#" style="visibility:hidden">← Previous</a>
          <a id="practice-btn" class="btn btn-primary" href="#" target="_blank" style="display:none">Practice →</a>
          <a id="next-btn" class="btn btn-primary" href="#" style="visibility:hidden">Next →</a>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
var LESSONS = [
  // Grade 1 — Free
  {grade:1, id:'g1-01', file:'course/grade1/01-staff-and-clefs.md',        title:'The Music Staff and Clefs',              topic:'Staff and Notation'},
  {grade:1, id:'g1-02', file:'course/grade1/02-note-names-treble.md',       title:'Note Names on the Treble Clef',          topic:'Staff and Notation'},
  {grade:1, id:'g1-03', file:'course/grade1/03-note-names-bass.md',         title:'Note Names on the Bass Clef',            topic:'Staff and Notation'},
  {grade:1, id:'g1-04', file:'course/grade1/04-accidentals.md',             title:'Accidentals — Sharps, Flats and Naturals', topic:'Staff and Notation'},
  {grade:1, id:'g1-05', file:'course/grade1/05-note-values.md',             title:'Note Values and Rests',                  topic:'Note Values'},
  {grade:1, id:'g1-06', file:'course/grade1/06-time-signatures.md',         title:'Time Signatures',                        topic:'Time Signatures'},
  {grade:1, id:'g1-07', file:'course/grade1/07-major-scales.md',            title:'Major Scales',                           topic:'Scales'},
  {grade:1, id:'g1-08', file:'course/grade1/08-harmonic-minor-scales.md',   title:'Harmonic Minor Scales',                  topic:'Scales'},
  {grade:1, id:'g1-09', file:'course/grade1/09-key-signatures.md',          title:'Key Signatures',                         topic:'Key Signatures'},
  {grade:1, id:'g1-10', file:'course/grade1/10-intervals-grade1.md',        title:'Intervals',                              topic:'Intervals'},
  {grade:1, id:'g1-11', file:'course/grade1/11-chords-major.md',            title:'Major Triads',                           topic:'Chords'},
  {grade:1, id:'g1-12', file:'course/grade1/12-cadences-grade1.md',         title:'Cadences — Perfect and Plagal',          topic:'Cadences'},
  {grade:1, id:'g1-13', file:'course/grade1/13-music-terms-grade1.md',      title:'Music Terms and Signs',                  topic:'Music Terms'},
  // Grade 2 — Paid
  {grade:2, id:'g2-01', file:'course/grade2/01-extended-scales.md',         title:'Extended Scales',                        topic:'Scales'},
  {grade:2, id:'g2-02', file:'course/grade2/02-extended-key-signatures.md', title:'Extended Key Signatures',                topic:'Key Signatures'},
  {grade:2, id:'g2-03', file:'course/grade2/03-compound-time.md',           title:'Compound Time — 6/8',                    topic:'Time Signatures'},
  {grade:2, id:'g2-04', file:'course/grade2/04-dotted-notes.md',            title:'Dotted Notes and Ties',                  topic:'Note Values'},
  {grade:2, id:'g2-05', file:'course/grade2/05-intervals-quality.md',       title:'Intervals — Quality and Number',         topic:'Intervals'},
  {grade:2, id:'g2-06', file:'course/grade2/06-minor-chords.md',            title:'Minor Chords and New Major Chords',      topic:'Chords'},
  {grade:2, id:'g2-07', file:'course/grade2/07-extended-cadences.md',       title:'Cadences in G and F Major',              topic:'Cadences'},
  {grade:2, id:'g2-08', file:'course/grade2/08-music-terms-grade2.md',      title:'Music Terms',                            topic:'Music Terms'},
  // Grade 3 — Paid
  {grade:3, id:'g3-01', file:'course/grade3/01-extended-keys-grade3.md',    title:'Extended Key Signatures and Scales',     topic:'Key Signatures'},
  {grade:3, id:'g3-02', file:'course/grade3/02-chord-inversions.md',        title:'Chord Inversions',                       topic:'Chords'},
  {grade:3, id:'g3-03', file:'course/grade3/03-all-four-cadences.md',       title:'All Four Cadences',                      topic:'Cadences'},
  {grade:3, id:'g3-04', file:'course/grade3/04-intervals-scale-degrees.md', title:'Intervals as Scale Degrees',             topic:'Intervals'},
  {grade:3, id:'g3-05', file:'course/grade3/05-binary-ternary-form.md',     title:'Binary and Ternary Form',               topic:'Musical Form'},
  {grade:3, id:'g3-06', file:'course/grade3/06-music-terms-grade3.md',      title:'Music Terms',                            topic:'Music Terms'},
];

var currentGrade = 1;
var currentLessonId = null;

/* ---- Grade tab switching ---- */
function switchGrade(g) {
  currentGrade = g;
  document.querySelectorAll('.course-grade-tab').forEach(function(btn) {
    btn.classList.toggle('active', parseInt(btn.dataset.grade) === g);
  });
  buildLessonList(g);
  buildMobileSelect(g);
}

/* ---- Build desktop sidebar list ---- */
function buildLessonList(grade) {
  var list = document.getElementById('lesson-list');
  list.innerHTML = '';
  var forGrade = LESSONS.filter(function(l) { return l.grade === grade; });
  var currentTopic = null;
  forGrade.forEach(function(lesson, i) {
    var locked = lesson.grade > 1 && !hasFullAccess();

    if (lesson.topic !== currentTopic) {
      currentTopic = lesson.topic;
      var topicLi = document.createElement('li');
      topicLi.className = 'course-topic-header';
      topicLi.textContent = lesson.topic;
      list.appendChild(topicLi);
    }

    var li = document.createElement('li');
    li.className = 'course-lesson-item' +
      (lesson.id === currentLessonId ? ' active' : '') +
      (locked ? ' locked' : '');
    var a = document.createElement('a');
    a.href = locked ? 'javascript:void(0)' : ('#' + lesson.id);
    a.textContent = (i + 1) + '. ' + lesson.title;
    if (locked) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        showUpgradeModal();
      });
    }
    li.appendChild(a);
    list.appendChild(li);
  });
}

/* ---- Build mobile select ---- */
function buildMobileSelect(grade) {
  var sel = document.getElementById('lesson-select-mobile');
  if (!sel) return;
  sel.innerHTML = '';
  LESSONS.filter(function(l) { return l.grade === grade; }).forEach(function(lesson, i) {
    var opt = document.createElement('option');
    opt.value = lesson.id;
    opt.textContent = (i + 1) + '. ' + lesson.title;
    if (lesson.id === currentLessonId) opt.selected = true;
    sel.appendChild(opt);
  });
}

/* ---- Navigate to a lesson by ID (from mobile select) ---- */
function navigateTo(lessonId) {
  var lesson = LESSONS.find(function(l) { return l.id === lessonId; });
  if (!lesson) return;
  if (lesson.grade > 1 && !hasFullAccess()) {
    showUpgradeModal();
    return;
  }
  location.hash = lessonId;
}

/* ---- Parse YAML-ish frontmatter ---- */
function parseFrontmatter(raw) {
  var match = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { meta: {}, body: raw };
  var meta = {};
  match[1].split('\n').forEach(function(line) {
    var idx = line.indexOf(':');
    if (idx > 0) {
      var key = line.slice(0, idx).trim();
      var val = line.slice(idx + 1).trim().replace(/^"(.*)"$/, '$1');
      meta[key] = val;
    }
  });
  return { meta: meta, body: match[2] };
}

/* ---- Replace ```abc blocks with rendered ABCJS staves ---- */
function renderAbcBlocks() {
  var blocks = document.querySelectorAll('#lesson-content pre code.language-abc');
  var i = 0;
  blocks.forEach(function(el) {
    var abcText = el.textContent || el.innerText;
    var div = document.createElement('div');
    div.className = 'staff-container';
    div.id = 'abc-' + i;
    el.closest('pre').replaceWith(div);
    try {
      ABCJS.renderAbc('abc-' + i, abcText, {
        scale: 1.8,
        staffwidth: 460,
        responsive: 'resize',
        paddingright: 0,
        paddingleft: 0
      });
    } catch(e) { div.style.display = 'none'; }
    i++;
  });
}

/* ---- Load and render a lesson ---- */
async function loadLesson() {
  var hash = location.hash.slice(1);
  if (!hash) {
    location.hash = 'g1-01';
    return;
  }

  var lesson = LESSONS.find(function(l) { return l.id === hash; });
  if (!lesson) {
    location.hash = 'g1-01';
    return;
  }

  // Grade gating
  if (lesson.grade > 1 && !hasFullAccess()) {
    showUpgradeModal();
    history.replaceState(null, '', location.pathname + (currentLessonId ? '#' + currentLessonId : ''));
    return;
  }

  currentLessonId = lesson.id;

  // Update tabs + sidebar
  switchGrade(lesson.grade);

  // Show loading state
  document.getElementById('lesson-content').innerHTML = '<p class="course-loading">Loading…</p>';
  document.getElementById('lesson-footer').style.display = 'none';

  try {
    var res = await fetch(lesson.file);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var raw = await res.text();
    var parsed = parseFrontmatter(raw);

    // Inject YouTube video embed (if frontmatter has youtube_id)
    var videoHtml = '';
    if (parsed.meta.youtube_id) {
      var ytTitle = parsed.meta.youtube_title || 'Tutorial video';
      videoHtml =
        '<div class="lesson-video">' +
          '<iframe src="https://www.youtube.com/embed/' + parsed.meta.youtube_id +
            '?rel=0&modestbranding=1" ' +
            'title="' + ytTitle + '" ' +
            'allowfullscreen loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>' +
        '</div>';
    }

    // Render markdown body
    var contentEl = document.getElementById('lesson-content');
    contentEl.innerHTML = videoHtml + marked.parse(parsed.body);
    renderAbcBlocks();

    // Lesson meta (grade badge + section label)
    var amebSection = parsed.meta.ameb_section || lesson.topic;
    document.getElementById('lesson-meta').innerHTML =
      '<span class="grade-badge grade-' + lesson.grade + '">Grade ' + lesson.grade + '</span>' +
      '<span class="course-ameb-section">Section III · ' + amebSection + '</span>';

    // Practice Now button
    var practiceBtn = document.getElementById('practice-btn');
    if (parsed.meta.practice_module && parsed.meta.practice_label) {
      practiceBtn.href = parsed.meta.practice_module;
      practiceBtn.textContent = 'Practice: ' + parsed.meta.practice_label + ' →';
      practiceBtn.style.display = '';
    } else {
      practiceBtn.style.display = 'none';
    }

    // Prev / Next buttons
    var idx = LESSONS.indexOf(lesson);
    var prev = LESSONS[idx - 1] || null;
    var next = LESSONS[idx + 1] || null;
    var prevBtn = document.getElementById('prev-btn');
    var nextBtn = document.getElementById('next-btn');

    if (prev) {
      prevBtn.href = '#' + prev.id;
      prevBtn.style.visibility = 'visible';
    } else {
      prevBtn.style.visibility = 'hidden';
    }
    if (next) {
      nextBtn.href = '#' + next.id;
      nextBtn.style.visibility = 'visible';
    } else {
      nextBtn.style.visibility = 'hidden';
    }

    document.getElementById('lesson-footer').style.display = 'flex';

    // Update mobile select value
    var sel = document.getElementById('lesson-select-mobile');
    if (sel) sel.value = lesson.id;

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch(e) {
    document.getElementById('lesson-content').innerHTML =
      '<p class="course-loading">Could not load this lesson. Make sure you are viewing the site via a web server (not file://).</p>';
  }
}

/* ---- Init ---- */
window.addEventListener('hashchange', loadLesson);

document.addEventListener('DOMContentLoaded', function() {
  // Build initial sidebar for Grade 1
  buildLessonList(1);
  buildMobileSelect(1);

  if (!location.hash || location.hash === '#') {
    location.hash = 'g1-01';
  } else {
    loadLesson();
  }
});
</script>
</body>
</html>
